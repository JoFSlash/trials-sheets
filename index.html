<style>
:root{--bg:#f6f7f9;--surface:#fff;--line:#e6e8ec;--text:#1b1f27;--muted:#6b7280;--accent:#0a8f74;--on-accent:#fff;--fail:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121417;--surface:#1a1d22;--line:#2a2e35;--text:#e7e9ed;--muted:#9097a3;--accent:#00dfb2;--on-accent:#04231c;--fail:#f87171}}
:root[data-theme="dark"]{--bg:#121417;--surface:#1a1d22;--line:#2a2e35;--text:#e7e9ed;--muted:#9097a3;--accent:#00dfb2;--on-accent:#04231c;--fail:#f87171}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.brand img{height:34px;width:auto;display:block}
h1{font-size:22px;margin:0}
p{color:var(--muted);margin:0 0 18px;font-size:14px}
.pw{position:relative;margin-bottom:14px}
.pw input{display:block;width:100%;height:46px;margin:0;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 48px 10px 12px}
.pw input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#eye{position:absolute;top:5px;right:5px;width:36px;height:36px;padding:0;display:grid;place-items:center;background:transparent;color:var(--muted);border:0;border-radius:6px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
#eye:hover,#eye.on{color:var(--text);background:var(--line)}
.remember{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:16px;color:var(--muted)}
#unlock{width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);cursor:pointer}
#unlock:disabled{opacity:.6;cursor:wait}
#unlock:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#error{color:var(--fail);font-weight:600;font-size:14px;margin:12px 0 0;min-height:1em}
</style>
</head>

const KEY_STORE = "trials-sheets-unlock";   // remembered key for "Remember on this device"
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = bytes => { let s = ""; bytes.forEach(b => { s += String.fromCharCode(b); }); return btoa(s); };
const form = document.getElementById("login");

async function deriveKey(password, salt, iterations = DATA.n) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: fromB64(salt), iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
}

/* The admin password unlocks the page key (DATA.wa) and opens the admin zone */
async function adminKeyToPageKey(password) {
  if (!DATA.wa) throw new Error("no admin");
  const adminKey = await deriveKey(password, DATA.as, DATA.an || DATA.n);
  const raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(DATA.wa.i) }, adminKey, fromB64(DATA.wa.c));
  sessionStorage.setItem("jof-trials-admin", toB64(new Uint8Array(await crypto.subtle.exportKey("raw", adminKey))));
  history.replaceState(null, "", location.pathname + location.search + "#admin");
  return crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, true, ["decrypt"]);
}

/* Replace this login page with the decrypted page, once it has fully loaded */
let opened = false;
const pageLoaded = () => new Promise(r => {
  if (document.readyState === "complete") return setTimeout(r, 0);
  window.addEventListener("load", () => setTimeout(r, 0), { once: true });
});
async function openWith(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(DATA.i) }, key, fromB64(DATA.c));
  const html = new TextDecoder().decode(plain);
  await pageLoaded();
  if (opened) return;
  opened = true;
  document.open(); document.write(html); document.close();
}

/* Remembered device: unlock straight away */
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_STORE); } catch (e) {}
  if (!saved) return;
  form.style.visibility = "hidden";
  try {
    await openWith(await crypto.subtle.importKey("raw", fromB64(saved), { name: "AES-GCM" }, true, ["decrypt"]));
  } catch (e) {
    try { localStorage.removeItem(KEY_STORE); } catch (_) {}
    form.style.visibility = "";
  }
})();
window.addEventListener("pageshow", e => { if (e.persisted) location.reload(); });

/* Hold the eye to show the password */
(() => {
  const input = document.getElementById("password"), eye = document.getElementById("eye");
  const reveal = on => { input.type = on ? "text" : "password"; eye.classList.toggle("on", on); };
  eye.addEventListener("pointerdown", e => { e.preventDefault(); eye.setPointerCapture(e.pointerId); reveal(true); });
  ["pointerup", "pointercancel", "lostpointercapture", "blur"].forEach(ev => eye.addEventListener(ev, () => reveal(false)));
  eye.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); reveal(true); } });
  eye.addEventListener("keyup", () => reveal(false));
  eye.addEventListener("contextmenu", e => e.preventDefault());
})();

form.addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("unlock"), error = document.getElementById("error");
  btn.disabled = true; btn.textContent = "Unlocking…"; error.textContent = "";
  try {
    const password = document.getElementById("password").value;
    let key = await deriveKey(password, DATA.s);
    try {
      await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(DATA.i) }, key, fromB64(DATA.c));
    } catch (notPagePassword) {
      key = await adminKeyToPageKey(password);   // throws if it's not the admin password either
    }
    if (document.getElementById("remember").checked) {
      try { localStorage.setItem(KEY_STORE, toB64(new Uint8Array(await crypto.subtle.exportKey("raw", key)))); } catch (_) {}
    }
    await openWith(key);
  } catch (err) {
    error.textContent = "Wrong password.";
    btn.disabled = false; btn.textContent = "Unlock";
  }
});
</script>
