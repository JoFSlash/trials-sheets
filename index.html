<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trials Sheets</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--line:#e6e8ec;--text:#1b1f27;--muted:#6b7280;--accent:#2563eb;--fail:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--surface:#1a1d22;--line:#2a2e35;--text:#e7e9ed;--muted:#9097a3;--accent:#60a5fa;--fail:#f87171}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
h1{font-size:22px;margin:0 0 4px}
p{color:var(--muted);margin:0 0 18px;font-size:14px}
.pw{position:relative;margin-bottom:14px}
.pw input{display:block;width:100%;height:46px;margin:0;font:inherit;font-size:16px;line-height:24px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 48px 10px 12px}
.pw #eye{position:absolute;top:5px;right:5px;width:36px;height:36px;padding:0;display:grid;place-items:center;background:transparent;color:var(--muted);border:0;border-radius:6px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.pw #eye:hover,.pw #eye.on{color:var(--text);background:var(--line)}
.rem{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:10px;color:var(--muted)}
.rem + button{margin-top:6px}
button{width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--fail);font-weight:600;font-size:14px;margin:12px 0 0;min-height:1em}
</style>
</head>
<body>
<form id="f">
  <h1>Trials Sheets</h1>
  <p>Enter the password from the forum to continue.</p>
  <div class="pw">
    <input type="password" id="pw" autocomplete="current-password" aria-label="Password" required autofocus>
    <button type="button" id="eye" aria-label="Hold to show password" title="Hold to show password"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <label class="rem"><input type="checkbox" id="rem"> Remember on this device</label>
  <button type="submit" id="btn">Unlock</button>
  <div id="err" role="alert"></div>
</form>

const b64 = s=>Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const SK = "trials-sheets-unlock";
async function derive(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(D.s), iterations:D.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
let shown = false;
const ready = ()=>new Promise(r=>{
  if (document.readyState === "complete") return setTimeout(r,0);
  window.addEventListener("load", ()=>setTimeout(r,0), {once:true});
});
async function show(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(D.i)}, key, b64(D.c));
  const html = new TextDecoder().decode(pt);
  await ready();
  if (shown) return;
  shown = true;
  document.open(); document.write(html); document.close();
}
(async()=>{
  let saved = null;
  try { saved = localStorage.getItem(SK); } catch(_) {}
  if (!saved) return;
  const form = document.getElementById("f");
  form.style.visibility = "hidden";
  try {
    const key = await crypto.subtle.importKey("raw", b64(saved), {name:"AES-GCM"}, true, ["decrypt"]);
    await show(key);
  } catch(e) {
    try { localStorage.removeItem(SK); } catch(_) {}
    form.style.visibility = "";
  }
})();
window.addEventListener("pageshow", e=>{ if (e.persisted) location.reload(); });
(()=>{
  const pw = document.getElementById("pw"), eye = document.getElementById("eye");
  const show = v=>{ pw.type = v ? "text" : "password"; eye.classList.toggle("on", v); };
  eye.addEventListener("pointerdown", e=>{ e.preventDefault(); eye.setPointerCapture(e.pointerId); show(true); });
  ["pointerup","pointercancel","lostpointercapture","blur"].forEach(ev=>eye.addEventListener(ev, ()=>show(false)));
  eye.addEventListener("keydown", e=>{ if (e.key===" "||e.key==="Enter") { e.preventDefault(); show(true); } });
  eye.addEventListener("keyup", ()=>show(false));
  eye.addEventListener("contextmenu", e=>e.preventDefault());
})();
document.getElementById("f").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn = document.getElementById("btn"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Unlocking…"; err.textContent = "";
  try {
    const key = await derive(document.getElementById("pw").value);
    if (document.getElementById("rem").checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      let s=""; raw.forEach(b=>s+=String.fromCharCode(b));
      try { localStorage.setItem(SK, btoa(s)); } catch(_) {}
    }
    await show(key);
  } catch(e) {
    err.textContent = "Wrong password.";
    btn.disabled = false; btn.textContent = "Unlock";
  }
});
</script>
